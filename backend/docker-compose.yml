name: nexusgesti

services:

  # ---------- Donnees ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexusgesti
      POSTGRES_USER: nexusgesti
      POSTGRES_PASSWORD: nexusgesti_secret
    ports:
      # 5433 côté hôte : un PostgreSQL Windows (postgresql-x64-18) occupe deja
      # 5432 en 0.0.0.0. Sans ce decalage, l'application atteint le mauvais
      # serveur et echoue en 28P01 sur un role "nexusgesti" d'un autre mot de
      # passe. Inter-conteneurs, le port reste 5432 (KC_DB_URL, DB_PORT).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusgesti"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret", "ping"]
      interval: 10s

  # ---------- Evenements ----------
  # Deux listeners, car aucun ne sert les deux clients :
  #   INTERNAL (kafka:29092)  -> conteneurs (kafka-init, services en Docker)
  #   EXTERNAL (localhost:9092) -> poste de dev (spring-boot:run)
  # Un unique listener annonce "localhost" : un client conteneur recoit cette
  # adresse dans les metadonnees, la resout sur lui-meme, et echoue en silence.
  # C'est ce qui bloquait kafka-init pendant 15 h.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "4L62ydgMQvunYgmq9ESgDw"
    healthcheck:
      # teste le chemin cross-conteneur : un healthcheck localhost ne prouve
      # pas qu'un autre conteneur puisse joindre le broker.
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/topics.sh:/scripts/topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/topics.sh"]
    restart: on-failure

  # ---------- Identite ----------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start --db=postgres --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_secret
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nexusgesti
      KC_DB_USERNAME: nexusgesti
      KC_DB_PASSWORD: nexusgesti_secret
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # "start" = mode production : Keycloak refuse de demarrer sans hostname.
      # Pas de proxy dans ce stack, on retire la contrainte plutot que de
      # figer un hostname qui casserait derriere un reverse-proxy.
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./infrastructure/keycloak/realm-nexusgesti.json:/opt/keycloak/data/import/realm-nexusgesti.json
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Objets et secrets ----------
  # Pas de stockage d'objets pour l'instant : aucun code Java ni dependance S3.
  # minio/minio n'est plus telechargeable anonymement sur Docker Hub ; on le
  # reintroduira quand le besoin document/GED existera reellement.
  vault:
    image: hashicorp/vault:1.17
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  # ---------- Supervision ----------
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data: