spring:
  application:
    name: socle-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:nexusgesti}
    username: ${DB_USER:nexusgesti_app}
    password: ${DB_PASSWORD:nexusgesti_secret}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: socle
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Sans url, Spring Boot derive le DataSource de migration du datasource
    # applicatif par reflection : il ne voit plus getUrl() une fois celui-ci
    # enveloppe par TenantAwareDataSource et plante au boot.
    url: ${FLYWAY_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:nexusgesti}}
    user: ${FLYWAY_USER:nexusgesti}
    password: ${FLYWAY_PASSWORD:nexusgesti_secret}
    schemas: socle
    default-schema: socle
    table: flyway_socle_history
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: socle-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nexusgesti}

server:
  port: ${SOCLE_SERVICE_PORT:8101}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# SecurityConfig declare sa propre SecurityFilterChain : on eteint celle de
# common-lib, qui matcherait aussi "any request" et ferait echouer le boot.
nexusgesti:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}
  security:
    oauth2:
      enabled: false
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:nexusgesti}
    client-id: ${KEYCLOAK_CLIENT_ID:nexusgesti-api}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:nexusgesti-service}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:service-client-secret-change-in-prod}
  auth:
    mfa-issuer: ${MFA_ISSUER:NexusGesti}
    encryption-key: ${MFA_ENCRYPTION_KEY:dev-mfa-encryption-key-32b!}
    session-refresh-days: 7
    max-sessions-per-user: 5
    login-max-attempts: 5
    login-lock-minutes: 15

logging:
  level:
    com.nexusgesti: INFO
  pattern:
    console: '{"timestamp":"%d","level":"%p","traceId":"%X{traceId}","service":"socle-service","msg":"%m"}%n'
