spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_secret}
  cloud:
    gateway:
      default-filters:
        # Les routes sont prefixees par le domaine (/api/v1/socle/...) mais les
        # services exposent /api/v1/<ressource>. On retire le segment de domaine
        # avant forwarding : /api/v1/socle/auth/login -> /api/v1/auth/login.
        # Si le chemin ne contient pas le motif, replaceAll le laisse intact.
        - name: RewritePath
          args:
            regexp: /api/v1/(socle|ped|boul)/(.*)
            replacement: /api/v1/$2
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@tenantKeyResolver}"
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback
      routes:
        # ---------- SOCLE (8101) ----------
        - id: socle-service
          uri: http://${SOCLE_SERVICE_HOST:localhost}:8101
          predicates:
            - Path=/api/v1/socle/**

        # ---------- PEDAGOGIE (8111) ----------
        - id: pedagogie-service
          uri: http://${PEDAGOGIE_SERVICE_HOST:localhost}:8111
          predicates:
            - Path=/api/v1/ped/**

        # ---------- BOULANGERIE ----------
        - id: boulangerie-service
          uri: http://${BOULANGERIE_SERVICE_HOST:localhost}:8141
          predicates:
            - Path=/api/v1/boul/**


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nexusgesti}

server:
  port: 8080

nexusgesti:
  gateway:
    # Reseau de confiance : chaque client porte son etablissement
    require-tenant-header: true
  cors:
    # Origines autorisees pour le navigateur (console). Surchargeable par
    # NEXUSGESTI_CORS_ALLOWED_ORIGINS si le port du frontend change.
    allowed-origins: ${NEXUSGESTI_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,https://gesti.mink67.com,http://gesti.mink67.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

resilience4j:
  timelimiter:
    configs:
      default:
        # 1s par defaut : le generateur de rapport met 2s, le CircuitBreaker
        # basculait en fallback avant la fin du traitement.
        timeoutDuration: 10s
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

logging:
  level:
    org.springframework.cloud.gateway: INFO