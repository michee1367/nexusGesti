global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Cibles = modules reels construits (AGENTS.md section 9). Les 20 services restants
# sont ajoutes ici au fur et a mesure de leur implementation.
# host.docker.internal resout le poste depuis les conteneurs (Docker Desktop).
scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: socle-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8101"]

  - job_name: pedagogie-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8111"]

  - job_name: boulangerie-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8141"]
