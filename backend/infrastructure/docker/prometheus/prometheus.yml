global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Cibles = modules reels construits (AGENTS.md section 9). Les 20 services restants
# sont ajoutes ici au fur et a mesure de leur implementation.
# host.docker.internal resout le poste depuis les conteneurs (Docker Desktop).
scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8103"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8104"]

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8105"]

  - job_name: reporting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8106"]

  - job_name: tenant-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8101"]

  - job_name: identity-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8102"]
